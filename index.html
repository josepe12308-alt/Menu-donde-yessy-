<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Donde Yessy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Nuestro Menú</h1>
    <nav class="menu-nav">
        <a href="#promos">Promos</a>
        <a href="#completos">Completos</a>
        <a href="#ass">Ass</a>
        <a href="#churrascos">Churrascos</a>
        <a href="#papas">Papas</a>
        <a href="#handroll">Menú Especial</a>
        <a href="#hamburguesas">Hamburguesas</a>
        <a href="#hamburguesa_pequenas">Hamb. Pequeñas</a>
        <a href="#extras">Extras</a>
        <a href="#agregados">Agregados</a>
    </nav>
</header>

<main class="galeria-menu">
    <section id="promos" class="carta-item">
        <h2>Promos</h2>
        <img src="img/promos.jpg" alt="Promos" loading="lazy">
    </section>

    <section id="completos" class="carta-item">
        <h2>Completos</h2>
        <img src="img/completos.jpg" alt="Completos" loading="lazy">
    </section>

    <section id="ass" class="carta-item">
        <h2>Ass</h2>
        <img src="img/ass.jpg" alt="Ass" loading="lazy">
    </section>

    <section id="churrascos" class="carta-item">
        <h2>Churrascos</h2>
        <img src="img/churrascos.jpg" alt="Churrascos" loading="lazy">
    </section>

    <section id="papas" class="carta-item">
        <h2>Papas</h2>
        <img src="img/papas.jpg" alt="Papas" loading="lazy">
    </section>

    <section id="handroll" class="carta-item">
        <h2>Menú Especial (Handroll)</h2>
        <img src="img/handroll.jpg" alt="Menú Especial Handroll" loading="lazy">
    </section>

    <section id="hamburguesas" class="carta-item">
        <h2>Hamburguesas</h2>
        <img src="img/hamburguesas.jpg" alt="Hamburguesas" loading="lazy">
    </section>

    <section id="hamburguesa_pequenas" class="carta-item">
        <h2>Hamburguesas Pequeñas</h2>
        <img src="img/hamburguesa_pequenas.jpg" alt="Hamburguesas Pequeñas" loading="lazy">
    </section>

    <section id="extras" class="carta-item">
        <h2>Extras</h2>
        <img src="img/extras.jpg" alt="Extras" loading="lazy">
    </section>

    <section id="agregados" class="carta-item">
        <h2>Agregados</h2>
        <img src="img/agregados.jpg" alt="Agregados" loading="lazy">
    </section>
</main>

</body>
</html>
